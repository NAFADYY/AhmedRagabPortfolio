      rel="stylesheet"
    />

    <!-- Prevent theme flash & enable progressive scroll reveal -->
    <script>
      (function () {
        var r = document.documentElement;
        r.classList.add('js');
        try {
          var t = localStorage.getItem('theme');
          var light = t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches);
          r.classList.toggle('dark', !light);
          r.classList.toggle('light', light);
          var lang = localStorage.getItem('language');
          if (lang === 'ar') {
            r.dir = 'rtl';
            r.lang = 'ar';
          }
        } catch (e) {}
      })();
    </script>
